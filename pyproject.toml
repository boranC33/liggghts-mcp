[project]
name = "liggghts-mcp"
version = "0.2.1"
description = "MCP server wrapping LIGGGHTS DEM simulation — let LLM agents drive granular-flow simulations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "boranC33" }]
keywords = ["mcp", "liggghts", "dem", "simulation", "llm", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/boranC33/liggghts-mcp"
Repository = "https://github.com/boranC33/liggghts-mcp"
Issues = "https://github.com/boranC33/liggghts-mcp/issues"

[project.scripts]
liggghts-mcp = "server:mcp.run"
